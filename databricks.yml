# This is a Databricks asset bundle definition for nyc_taxi.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi
  uuid: ade1ea1d-ba3a-4e84-8f20-3bfbfdf9d7b9

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-becba6f7-c87c.cloud.databricks.com
    variables:
      catalog: nyc_taxi_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-becba6f7-c87c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/tmendes.aws@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/tmendes.aws@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nyc_taxi_prod
    permissions:
      - user_name: tmendes.aws@gmail.com
        level: CAN_MANAGE
