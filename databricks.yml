# This is a Databricks asset bundle definition for nyc_taxi.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi
  uuid: ade1ea1d-ba3a-4e84-8f20-3bfbfdf9d7b9

include:
  - resources/*.yml

sync:
  include:
    - dist/*.whl

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variables intended for easy override when cloning this repository.
# Example:
#   databricks bundle deploy -t dev --var="catalog=nyc_taxi_dev_john"
variables:
  catalog:
    description: The catalog to use
    default: nyc_taxi_dev
  wheel_file:
    description: Wheel filename generated under dist/ and uploaded with bundle files
    default: CHANGE_ME_WHEEL_FILE.whl

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      # Use the workspace configured in Databricks CLI auth/profile.
      # This keeps the repo portable for any contributor.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
