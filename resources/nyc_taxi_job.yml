# nyc_taxi_job — pipeline mensal NYC Yellow Taxi (landing -> bronze -> silver -> gold)
#
# Decisões refletidas neste YAML:
#
# - Schedule cron mensal no dia 02 às 05:00 (America/Sao_Paulo): alinhado
#   com o ciclo de publicação do TLC (~30-45 dias de atraso). Rodar dia 02
#   dá margem para o TLC publicar o mês anterior.
#
# - Landing (modo explícito): ano/mês/taxi vêm de *job parameters*
#   (`{{ job.parameters.* }}` → argv), com default no deploy a partir de
#   `target_year` / `target_months` / `taxi_type` do bundle. Assim,
#   `bundle run --params` altera a janela sem redeploy (vars do bundle
#   sozinhas só afetam o deploy). Discovery continua opcional via override
#   manual; não é o modo do schedule.
#
# - Os argv do wheel ficam em `python_wheel_task.parameters`; os valores de
#   ano/mês/taxi referenciam job parameters; catalog/environment seguem ${var.*}.
#
# - Bronze tem `max_retries: 2` por design — schema evolution do Auto Loader
#   propositalmente termina o stream com UnknownFieldException na primeira
#   detecção de coluna nova (ADR-007). Sem retry, "evolução automática" não
#   se materializa.
#
# - Landing tem `max_retries: 1` para resiliência a falha transitória do CDN
#   do TLC, complementando o retry interno do download_with_retry.
#
# - `--environment` é derivado do bundle target (dev/stg/prd) via ${bundle.target}.
#
# - `--taxi-type` no schedule defaulta via job parameter `taxi_type`
#   (default do bundle: `both`). Override em run/deploy como antes.

resources:
  jobs:
    nyc_taxi_job:
      name: nyc_taxi_job

      # Job parameters: resolvidos em cada run (inclui `bundle run --params`).
      # Defaults usam ${var.*} no deploy; override em ad hoc sem redeploy.
      # Ver: https://docs.databricks.com/aws/en/dev-tools/bundles/job-parameters
      parameters:
        - name: target_year
          default: ${var.target_year}
        - name: target_months
          default: ${var.target_months}
        - name: taxi_type
          default: ${var.taxi_type}

      schedule:
        # Roda 1x ao mês no dia 02 às 05:00 da manhã (horário de São Paulo).
        # Quartz cron: segundo minuto hora dia-do-mês mês dia-da-semana.
        # `0 0 5 2 * ?` = às 05:00:00, no dia 02, todo mês, qualquer dia da semana.
        quartz_cron_expression: "0 0 5 2 * ?"
        timezone_id: "America/Sao_Paulo"
        # UNPAUSED explícito: em `mode: development` do bundle, schedules são
        # pausados automaticamente; em `mode: production`, ficam ativos.
        # Declarar explicitamente torna a intenção clara em ambos os modos.
        pause_status: UNPAUSED

      # email_notifications:
      #   on_failure:
      #     - your_email@example.com

      tasks:

        # ---------------------------------------------------------------------
        # 01 — Landing: baixa Parquets do TLC para UC Volume (modo explícito)
        # ---------------------------------------------------------------------
        - task_key: landing
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: landing_layer
            parameters:
              - "--target-year={{ job.parameters.target_year }}"
              - "--target-months={{ job.parameters.target_months }}"
              - "--taxi-type={{ job.parameters.taxi_type }}"
              - "--catalog=${var.catalog}"
              - "--environment=${bundle.target}"

        # ---------------------------------------------------------------------
        # 02 — Bronze: Auto Loader -> Delta append-only
        # ---------------------------------------------------------------------
        # max_retries=2 é obrigatório aqui (ver ADR-007): schema evolution do
        # Auto Loader termina o stream com UnknownFieldException quando detecta
        # coluna nova. Segunda execução já enxerga schema atualizado e prossegue.
        - task_key: bronze
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 30000
          depends_on:
            - task_key: landing
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: bronze_layer
            parameters:
              - "--taxi-type={{ job.parameters.taxi_type }}"
              - "--catalog=${var.catalog}"
              - "--environment=${bundle.target}"

        # ---------------------------------------------------------------------
        # 03 — Silver: limpeza, dedup, contrato de qualidade
        # ---------------------------------------------------------------------
        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: silver_layer
            parameters:
              - "--taxi-type={{ job.parameters.taxi_type }}"
              - "--catalog=${var.catalog}"
              - "--environment=${bundle.target}"

        # ---------------------------------------------------------------------
        # 04 — Gold: view de consumo
        # ---------------------------------------------------------------------
        # Publica `gold.vw_taxi_trips` — view que une yellow + green com
        # alias `lpep_*` -> `tpep_*` e expoe as colunas obrigatorias do
        # contrato de consumo (VendorID, passenger_count, total_amount,
        # tpep_pickup_datetime, tpep_dropoff_datetime + taxi_type para
        # lineage).
        #
        # As perguntas analiticas (A: media mensal yellow; B: media horaria
        # cross-taxi em mai/2023) NAO sao materializadas — sao respondidas
        # por SQL ad-hoc rodando contra a view (ver analysis/perguntas_analiticas.sql
        # e ADR-014). View e' `CREATE OR REPLACE` idempotente, sem refresh
        # de dados; gold nao depende de `--taxi-type`. Fail-fast (mesma
        # politica do silver).
        - task_key: gold
          environment_key: default
          depends_on:
            - task_key: silver
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: gold_layer
            parameters:
              - "--catalog=${var.catalog}"
              - "--environment=${bundle.target}"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            # Serverless jobs: Python dependencies declaradas no environment.
            dependencies:
              - ${workspace.file_path}/dist/${var.wheel_file}

      queue:
        enabled: true