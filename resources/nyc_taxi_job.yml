# A sample job for nyc_taxi.

resources:
  jobs:
    nyc_taxi_job:
      name: nyc_taxi_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: landing
          environment_key: default
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: landing_layer

        - task_key: bronze
          environment_key: default
          depends_on:
            - task_key: landing
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: bronze_layer

        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: silver_layer

        - task_key: gold
          environment_key: default
          depends_on:
            - task_key: silver
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: gold_layer
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            # For serverless jobs, Python dependencies must be declared in environment.
            dependencies:
              - ${workspace.file_path}/dist/${var.wheel_file}
      queue:
        enabled: true