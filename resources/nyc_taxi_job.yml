# A sample job for nyc_taxi.

resources:
  jobs:
    nyc_taxi_job:
      name: nyc_taxi_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: landing
          job_cluster_key: nyc_taxi_job_cluster
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: landing_layer
          libraries:
            - whl: ../dist/nyc_taxi-0.1.0-py3-none-any.whl

        - task_key: bronze
          job_cluster_key: nyc_taxi_job_cluster
          depends_on:
            - task_key: landing
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: bronze_layer
          libraries:
            - whl: ../dist/nyc_taxi-0.1.0-py3-none-any.whl

        - task_key: silver
          job_cluster_key: nyc_taxi_job_cluster
          depends_on:
            - task_key: bronze
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: silver_layer
          libraries:
            - whl: ../dist/nyc_taxi-0.1.0-py3-none-any.whl

        - task_key: gold
          job_cluster_key: nyc_taxi_job_cluster
          depends_on:
            - task_key: silver
          python_wheel_task:
            package_name: nyc_taxi
            entry_point: gold_layer
          libraries:
            - whl: ../dist/nyc_taxi-0.1.0-py3-none-any.whl

      job_clusters:
        - job_cluster_key: nyc_taxi_job_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1e
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i3.xlarge
            driver_node_type_id: i3.xlarge
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 1
              max_workers: 1
      queue:
        enabled: true